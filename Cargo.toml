[package]
name = "konomitv-proxy"
version = "0.1.3"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.9", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
random_str = "1.1.1"
reqwest = { version = "0.13.5", features = ["stream"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
